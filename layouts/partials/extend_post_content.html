{{- /* Custom post content extension */ -}}
<div class="reading-progress" id="reading-progress"></div>

<script>
  // Reading progress bar
  window.addEventListener('scroll', function() {
    var el = document.getElementById('reading-progress');
    if (!el) return;
    var doc = document.documentElement;
    var scrollTop = doc.scrollTop || document.body.scrollTop;
    var scrollHeight = doc.scrollHeight - doc.clientHeight;
    var progress = (scrollTop / scrollHeight) * 100;
    el.style.width = progress + '%';
  });
</script>


<!-- 一键转发分享条 -->
<div class="share-bar-paper" id="shareBarPaper">
  <span class="share-label">一键转发</span>
  <a class="share-btn-paper" id="shareX" target="_blank" rel="noopener" href="#" title="分享到 X">𝕏</a>
  <button class="share-btn-paper" id="shareCopy" title="复制链接">复制链接</button>
  <button class="share-btn-paper" id="shareWx" title="微信扫码转发">微信</button>
  <button class="share-btn-paper" id="shareNative" title="系统分享" style="display:none">更多</button>
  <span class="share-tip" id="shareTip"></span>
</div>
<style>
.share-bar-paper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:36px 0 8px;padding:16px 20px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow-hard)}
.share-bar-paper .share-label{font-size:14px;font-weight:700;color:var(--ink-soft);margin-right:4px;font-family:var(--sans)}
.share-btn-paper{display:inline-flex;align-items:center;background:transparent;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer;text-decoration:none;font-family:var(--sans);transition:all .15s}
.share-btn-paper:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.share-bar-paper .share-tip{font-size:12px;color:var(--accent);min-height:16px;font-family:var(--sans)}
</style>
<script>
(function(){
  var bar=document.getElementById('shareBarPaper');if(!bar)return;
  var title=document.title||'';
  var url=location.href.split('#')[0];
  var x=document.getElementById('shareX');
  x.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(title)+'&url='+encodeURIComponent(url);
  var tip=document.getElementById('shareTip');
  document.getElementById('shareWx').addEventListener('click',function(){
    var modal=document.getElementById('wxShareModal');
    if(!modal){
      modal=document.createElement('div');modal.id='wxShareModal';
      modal.innerHTML='<div class="wxm-bg"></div><div class="wxm-box"><div class="wxm-title">微信扫码转发</div><img class="wxm-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url)+'" alt="QR"><div class="wxm-hint">微信扫一扫，在微信内打开后<br>点右上角转发给朋友 / 分享到朋友圈</div><button class="wxm-close">关闭</button></div>';
      var st=document.createElement('style');
      st.textContent='#wxShareModal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center}#wxShareModal .wxm-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}#wxShareModal .wxm-box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 30px;text-align:center;max-width:320px;box-shadow:var(--shadow-hard)}#wxShareModal .wxm-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;font-family:var(--sans)}#wxShareModal .wxm-qr{width:200px;height:200px;border-radius:8px;background:#fff;padding:8px}#wxShareModal .wxm-hint{font-size:12.5px;color:var(--ink-soft);margin:12px 0 16px;line-height:1.7;font-family:var(--sans)}#wxShareModal .wxm-close{background:transparent;border:1px solid var(--line);color:var(--ink);font-size:13px;padding:8px 28px;border-radius:8px;cursor:pointer;font-family:var(--sans)}#wxShareModal .wxm-close:hover{border-color:var(--accent);color:var(--accent)}';
      document.head.appendChild(st);document.body.appendChild(modal);
      modal.querySelector('.wxm-bg').addEventListener('click',function(){modal.remove();});
      modal.querySelector('.wxm-close').addEventListener('click',function(){modal.remove();});
    }
    modal.style.display='flex';
  });
  document.getElementById('shareCopy').addEventListener('click',function(){
    function done(m){tip.textContent=m;setTimeout(function(){tip.textContent='';},2000);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){done('链接已复制');},function(){done('复制失败，请手动复制地址栏');});
    }else{
      var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done('链接已复制');}catch(e){done('复制失败，请手动复制地址栏');}
      ta.remove();
    }
  });
  if(navigator.share){
    var nb=document.getElementById('shareNative');nb.style.display='';
    nb.addEventListener('click',function(){navigator.share({title:title,url:url}).catch(function(){});});
  }
})();
</script>
