function b64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(){
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('err');
  err.textContent='';
  if(!pw){err.textContent='请输入密码';return;}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    const html=new TextDecoder().decode(pt);
    document.getElementById('gate').style.display='none';
    const a=document.getElementById('article');
    a.innerHTML=html;a.style.display='block';
    window.scrollTo(0,0);
  }catch(e){err.textContent='密码错误，请重试';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
